<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--ground:#FBFAFC;--surface:#F1EEF4;--surface-2:#E6E2EC;--ink:#1A1721;--ink-soft:#4A4455;--ink-faint:#6E6779;--rule:#D8D3E0;--rubric:#9E2B25;--rubric-soft:#B8524C;--rubric-wash:#F7EDEC;--indigo:#3D4E7A;--indigo-wash:#EAEDF5;--display:"Frank Ruhl Libre",Georgia,serif;--body:"Assistant","Segoe UI",system-ui,sans-serif;--data:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#141218;--surface:#1E1B24;--surface-2:#292430;--ink:#EAE6F0;--ink-soft:#B5AEC0;--ink-faint:#8B8397;--rule:#342E3D;--rubric:#E08079;--rubric-soft:#C4655E;--rubric-wash:#2C1E1E;--indigo:#94A7DC;--indigo-wash:#1C2130}}
:root[data-theme="dark"]{--ground:#141218;--surface:#1E1B24;--surface-2:#292430;--ink:#EAE6F0;--ink-soft:#B5AEC0;--ink-faint:#8B8397;--rule:#342E3D;--rubric:#E08079;--rubric-soft:#C4655E;--rubric-wash:#2C1E1E;--indigo:#94A7DC;--indigo-wash:#1C2130}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;direction:rtl;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--rule);padding:.75rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:var(--data);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rubric)}
.count{font-family:var(--data);font-size:.8rem;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-inline-start:auto;direction:ltr;unicode-bidi:isolate}
.bar{height:3px;background:var(--surface-2);width:100%}
.bar>i{display:block;height:100%;background:var(--rubric);transition:width .18s ease}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem 1.25rem}
.card{width:100%;max-width:44rem;display:flex;flex-direction:column;gap:1.75rem}
.prompt{font-family:var(--data);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.sentence{font-family:var(--display);font-weight:500;font-size:clamp(1.35rem,4.6vw,2rem);line-height:1.75;text-align:center;text-wrap:balance}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--rubric);margin-inline:.15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
button{font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:6px;transition:background .12s,border-color .12s}
button:hover{background:var(--surface-2);border-color:var(--rubric-soft)}
button:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.opt{padding:1.1rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.opt .w{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,4.4vw,1.75rem)}
.opt .k,.esc .k{font-family:var(--data);font-size:.68rem;color:var(--ink-faint);letter-spacing:.06em}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.escs{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.esc{padding:.7rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.95rem;color:var(--ink-soft)}
.nav{display:flex;justify-content:space-between;align-items:center;font-family:var(--data);font-size:.72rem;color:var(--ink-faint)}
.nav button{background:none;border:none;padding:.35rem .5rem;color:var(--ink-faint);font-family:var(--data);font-size:.72rem}
.nav button:hover{color:var(--rubric);background:none}
.done{max-width:44rem;width:100%;display:flex;flex-direction:column;gap:1.25rem}
.done h1{font-family:var(--display);font-size:2rem;margin:0;font-weight:900}
.done p{margin:0;color:var(--ink-soft)}
.stats{display:flex;gap:1.5rem;unicode-bidi:isolate;flex-wrap:wrap;font-family:var(--data);font-size:.85rem;font-variant-numeric:tabular-nums;padding:1rem;background:var(--surface);border-radius:6px;border:1px solid var(--rule)}
.stats b{color:var(--ink)}
textarea{width:100%;height:11rem;font-family:var(--data);font-size:.72rem;direction:ltr;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:.75rem;resize:vertical}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.row button{padding:.65rem 1.25rem;border-radius:6px}
.primary{background:var(--rubric);border-color:var(--rubric);color:#fff}
.primary:hover{background:var(--rubric-soft);border-color:var(--rubric-soft)}
.note{font-size:.85rem;color:var(--ink-faint)}
footer{border-top:1px solid var(--rule);padding:.6rem 1.25rem;font-family:var(--data);font-size:.68rem;color:var(--ink-faint);display:flex;gap:1rem;flex-wrap:wrap}
footer span{unicode-bidi:isolate}
@media (max-width:520px){.opts{grid-template-columns:1fr}.escs{grid-template-columns:1fr}}
</style>
<header>
  <span class="brand">__TITLE__</span>
  <span class="count" id="count"></span>
</header>
<div class="bar"><i id="bar" style="width:0"></i></div>
<main id="main"></main>
<footer>
  <span><span class="num">1</span>/<span class="num">2</span> — בחירה</span><span><span class="num">3</span> — שתיהן תקינות</span><span><span class="num">4</span> — לא ברור</span>
  <span>← חזרה</span><span id="saved">נשמר אוטומטית</span>
</footer>
<script>
const BATCH = __BATCH_JSON__;
const KEY = "hebrew-ime-labels-" + BATCH.batch_id;
let answers = {}, at = 0, shownAt = 0;

try { const raw = localStorage.getItem(KEY); if (raw) answers = JSON.parse(raw) || {}; } catch (e) { answers = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch(e){
  document.getElementById("saved").textContent = "לא נשמר — העתק בסוף"; } }

const items = BATCH.items;
// Resume where they stopped rather than at the top.
at = items.findIndex(function(it){ return !answers[it.id]; });
if (at < 0) at = items.length;

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function render(){
  const main = document.getElementById("main");
  const answered = Object.keys(answers).length;
  document.getElementById("bar").style.width = (100 * answered / items.length) + "%";
  document.getElementById("count").textContent = answered + "/" + items.length;

  if (at >= items.length) { renderDone(main); return; }

  const it = items[at];
  const words = it.sentence.map(function(w, i){
    return i === it.position ? '<span class="gap">&nbsp;</span>' : esc(w);
  }).join(" ");

  main.innerHTML =
    '<div class="card">' +
      '<div class="prompt">איזו מילה שייכת כאן?</div>' +
      '<div class="sentence">' + words + '</div>' +
      '<div class="opts">' +
        '<button class="opt" data-a="1"><span class="w">' + esc(it.options[0]) + '</span><span class="k">1</span></button>' +
        '<button class="opt" data-a="2"><span class="w">' + esc(it.options[1]) + '</span><span class="k">2</span></button>' +
      '</div>' +
      '<div class="escs">' +
        '<button class="esc" data-a="3">שתיהן תקינות <span class="k">3</span></button>' +
        '<button class="esc" data-a="4">אף אחת / לא ברור <span class="k">4</span></button>' +
      '</div>' +
      '<div class="nav">' +
        '<button id="back">← אחורה</button>' +
        '<span>פריט <span class="num">' + (at + 1) + '</span> מתוך <span class="num">' + items.length + '</span></span>' +
      '</div>' +
    '</div>';

  Array.prototype.forEach.call(main.querySelectorAll("[data-a]"), function(b){
    b.addEventListener("click", function(){ answer(parseInt(b.dataset.a, 10)); });
  });
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", goBack);
  shownAt = performance.now();
}

function answer(choice){
  const it = items[at];
  answers[it.id] = { choice: choice, ms: Math.round(performance.now() - shownAt) };
  save();
  at++;
  render();
}

function goBack(){ if (at > 0) { at--; render(); } }

document.addEventListener("keydown", function(e){
  if (at >= items.length) return;
  if (e.key >= "1" && e.key <= "4") { answer(parseInt(e.key, 10)); e.preventDefault(); }
  else if (e.key === "ArrowRight" || e.key === "Backspace") { goBack(); e.preventDefault(); }
});

function renderDone(main){
  const times = items.map(function(it){ return answers[it.id] && answers[it.id].ms; })
                     .filter(function(m){ return typeof m === "number" && m < 120000; })
                     .sort(function(a,b){ return a-b; });
  const median = times.length ? times[Math.floor(times.length/2)] : 0;
  const total = times.reduce(function(a,b){ return a+b; }, 0);
  const counts = {1:0,2:0,3:0,4:0};
  items.forEach(function(it){ const a = answers[it.id]; if (a) counts[a.choice]++; });

  const payload = JSON.stringify({
    batch_id: BATCH.batch_id, seed: BATCH.seed, protocol: BATCH.protocol,
    answers: answers
  });

  main.innerHTML =
    '<div class="done">' +
      '<h1>סיימת</h1>' +
      '<p>העתק את התוצאה והדבק אותה בשיחה. שום דבר לא נשלח לשום מקום מהעמוד הזה.</p>' +
      '<div class="stats">' +
        '<span>הוכרעו <b class="num">' + Object.keys(answers).length + '</b></span>' +
        '<span>זמן חציוני <b class="num">' + (median/1000).toFixed(1) + '</b> שנ’</span>' +
        '<span>סה״כ <b class="num">' + Math.round(total/60000) + '</b> דק’</span>' +
        '<span>1/2: <b class="num">' + (counts[1]+counts[2]) + '</b></span>' +
        '<span>3: <b class="num">' + counts[3] + '</b></span>' +
        '<span>4: <b class="num">' + counts[4] + '</b></span>' +
      '</div>' +
      '<textarea id="out" readonly></textarea>' +
      '<div class="row">' +
        '<button class="primary" id="copy">העתק תוצאה</button>' +
        '<button id="again">חזור לפריט הראשון</button>' +
        '<button id="reset">מחק והתחל מחדש</button>' +
      '</div>' +
      '<p class="note">אם ההעתקה לא עובדת — סמן את כל הטקסט בתיבה והעתק ידנית.</p>' +
    '</div>';

  document.getElementById("out").value = payload;
  document.getElementById("copy").addEventListener("click", function(){
    const btn = this, ta = document.getElementById("out");
    ta.select();
    function ok(){ btn.textContent = "הועתק"; setTimeout(function(){ btn.textContent = "העתק תוצאה"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(ok, function(){ try { document.execCommand("copy"); ok(); } catch(e){} });
    } else { try { document.execCommand("copy"); ok(); } catch(e){} }
  });
  document.getElementById("again").addEventListener("click", function(){ at = 0; render(); });
  document.getElementById("reset").addEventListener("click", function(){
    if (!confirm("למחוק את כל התשובות באצווה הזאת?")) return;
    answers = {}; save(); at = 0; render();
  });
}

render();
</script>
