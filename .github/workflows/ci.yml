name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The gates below run on EVERY push. Each one runs its positive control first and fails the
# build if the control does not go red -- see scripts/run_gates.py.
jobs:
  gates:
    name: Gates (with positive controls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependency coordinates (feeds GATE-NET-1 deps detector)
        run: ./gradlew dependencyAudit

      - name: Run all gates + positive controls
        run: python3 scripts/run_gates.py --verbose

      - name: Test the gates themselves
        run: python3 tools/gate_tests/test_gates.py

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: build/reports/
          if-no-files-found: ignore

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run :core unit tests
        run: ./gradlew :core:test

      # A test task that runs zero tests is a zero denominator, which this project treats as
      # NOT-MEASURED rather than green. Fail loudly instead.
      - name: Assert the test suite actually ran tests
        run: python3 scripts/assert_tests_ran.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build:
    name: Assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble all modules
        run: ./gradlew assemble
