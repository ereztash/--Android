name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Every gate below runs its POSITIVE CONTROL first and fails the build if the control does not
# go red. See scripts/run_gates.py -- a gate whose control comes back green is reported as
# NOT-A-GATE and fails the run regardless of what it said about the real tree.
jobs:
  gates:
    name: Gates (with positive controls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the gate scripts' one third-party dependency
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0
      - name: GATE-XML-1 (fast fail)
        run: python3 scripts/check_xml.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve dependency coordinates (feeds GATE-NET-1 deps detector)
        run: ./gradlew dependencyAudit
      - name: Assemble debug, release, and the netcontrol positive-control APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleNetcontrol
      - name: Fetch upstream lexicon sources (best-effort; feeds GATE-LEX-1/2)
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/check_lexicon.py --allow-fetch --json > /dev/null
      - name: Report whether the lexicon sources are present
        run: |
          for f in lexicon/cache/InflectedVerbsExtended.csv lexicon/cache/he_full.txt; do
            if [ -f "$f" ]; then
              echo "present: $f ($(stat -c%s "$f") bytes)"
            else
              echo "ABSENT: $f -- GATE-LEX-2 will report NOT-MEASURED, not PASS"
            fi
          done
      - name: Run all gates + positive controls
        run: python3 scripts/run_gates.py --verbose
      - name: Test the gates themselves
        run: python3 tools/gate_tests/test_gates.py
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 1

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run :core unit tests
        run: ./gradlew :core:test
      - name: Assert the suite actually ran tests
        run: python3 scripts/assert_tests_ran.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the app and the benchmark host
        run: ./gradlew :app:assembleDebug :hostapp:assembleDebug
      - name: Assemble the latency benchmark
        run: ./gradlew :benchmark:assembleBenchmark
      - name: Lint
        run: ./gradlew :app:lintDebug
